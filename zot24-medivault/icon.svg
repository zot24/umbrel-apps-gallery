<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="MediVault">
  <!-- Sharp-cornered background — Umbrel applies the rounded mask in CSS. -->
  <!-- MediVault's own palette: the app's sage-to-teal mark on its dark ground. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16211d"/>
      <stop offset="1" stop-color="#0e1613"/>
    </linearGradient>
    <linearGradient id="shield" x1="140" y1="96" x2="372" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FC49B"/>
      <stop offset="1" stop-color="#4AA8A2"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ground)"/>

  <!-- The shield the app wears in its own navigation. -->
  <path d="M256 96 L392 148 V266 C392 344 332 400 256 424 C180 400 120 344 120 266 V148 Z"
        fill="url(#shield)"/>

  <!-- A single heartbeat, knocked out of the shield so it reads at tile size. -->
  <path d="M154 268 H206 L228 222 L256 318 L282 250 L300 268 H358"
        fill="none" stroke="#0e1613" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
